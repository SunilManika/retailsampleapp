- hosts: localhost
  become: true
  gather_facts: false

  vars:
    namespace: retail-automation
    
    app_dir: /opt/retailapp
    terraform_dir: /root/retailapp-main/automation

    ocp_server: "{{ lookup('env','OCP_SERVER') }}"
    ocp_token: "{{ lookup('env','OC_TOKEN') | default('', true) }}"
    ocp_username: "{{ lookup('env','OC_USERNAME') | default('', true) }}"
    ocp_password: "{{ lookup('env','OC_PASSWORD') | default('', true) }}"
    storage_class: "{{ lookup('env','STORAGE_CLASS') | default('', true) }}"

    docker_username: "{{ lookup('env', 'DOCKER_USERNAME') }}"
    docker_password: "{{ lookup('env', 'DOCKER_PASSWORD') }}"

    # PostgreSQL credentials
    postgres_db: retaildb
    postgres_user: retail_user
    postgres_password: retail_password

    # IBM Verify Configuration
    ibm_verify_issuer: "{{ lookup('env', 'IBM_VERIFY_ISSUER') }}"
    ibm_verify_client_id: "{{ lookup('env', 'IBM_VERIFY_CLIENT_ID') }}"
    ibm_verify_client_secret: "{{ lookup('env', 'IBM_VERIFY_CLIENT_SECRET') }}"
    ibm_verify_callback_url: "{{ lookup('env', 'IBM_VERIFY_CALLBACK_URL') }}"
    ibm_verify_scope: "{{ lookup('env', 'IBM_VERIFY_SCOPE') | default('openid profile email', true) }}"
    
    # Application secrets
    session_secret: "{{ lookup('env', 'SESSION_SECRET') | default('change-this-in-production', true) }}"
    jwt_secret: "{{ lookup('env', 'JWT_SECRET') | default('super-secret-change-in-prod', true) }}"
    frontend_url: "{{ lookup('env', 'FRONTEND_URL') }}"

  tasks:
  - name: Install prerequisites
    include_role:
      name: install_prereqs
  - name: Install oc CLI
    include_role:
      name: install_oc_cli
  - name: Install JMeter
    include_role:
      name: install_jmeter
  - name: Download retail application
    include_role:
      name: download_application
  - name: Update YAML images and namespace
    include_role:
      name: update_yaml_images
  - name: OpenShift login
    include_role:
      name: oc_login
  - name: Podman login
    include_role:
      name: podman_login
  - name: Create Docker registry secret
    include_role:
      name: terraform_create_docker_secret
  - name: Build and push postgresql image
    include_role:
      name: build_postgresql
  - name: Build and push backend image
    include_role:
      name: build_backend
  - name: Build and push initial frontend image
    include_role:
      name: build_frontend_initial
  - name: Prepare namespace
    include_role:
      name: terraform_prepare_namespace
  - name: Prepare ServiceAccount
    include_role:
      name: prepare_serviceaccount
  - name: Create IBM Verify secret
    include_role:
      name: create_ibm_verify_secret
  - name: Deploy retail manifests
    include_role:
      name: terraform_deploy_retail_manifests
  - name: Verify backend deployment exists
    command: oc get deployment retail-backend -n {{ namespace }}
  - name: Rebuild frontend with backend route
    include_role:
      name: rebuild_frontend_with_route
  - name: Restart deployments
    include_role:
      name: restart_deployments
  - name: Load PostgreSQL database
    include_role:
      name: terraform_load_database
