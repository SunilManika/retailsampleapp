apiVersion: v1
kind: Namespace
metadata:
  name: NAMESPACE_PLACEHOLDER
  labels:
    environment: NAMESPACE_PLACEHOLDER
    app.kubernetes.io/environment: NAMESPACE_PLACEHOLDER

    # Pod Security Standards — baseline allows anyuid SCC granted in deploy.sh
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
