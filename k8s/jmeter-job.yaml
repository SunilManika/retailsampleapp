apiVersion: batch/v1
kind: Job
metadata:
  name: jmeter-simulation
  namespace: NAMESPACE_PLACEHOLDER
spec:
  ttlSecondsAfterFinished: 3600  # Clean up job after 1 hour
  backoffLimit: 0  # Don't retry on failure
  template:
    metadata:
      labels:
        app: jmeter-simulation
    spec:
      restartPolicy: Never
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: jmeter
        image: docker.io/DOCKER_USERNAME_PLACEHOLDER/retail-jmeter:1.0.1
        imagePullPolicy: Always
        command: ["bash", "/jmeter/run_spike.sh"]
        args: ["BACKEND_ROUTE_PLACEHOLDER"]
        env:
        - name: JVM_ARGS
          value: "-Djmeter.logfile=/tmp/jmeter.log"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

