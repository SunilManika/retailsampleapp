apiVersion: v1
kind: Secret
metadata:
  name: rag-credentials
  namespace: NAMESPACE_PLACEHOLDER
type: Opaque
stringData:
  # IBM Watsonx Credentials
  watsonx-api-key: WATSONX_API_KEY_PLACEHOLDER
  watsonx-project-id: WATSONX_PROJECT_ID_PLACEHOLDER

  # Milvus Credentials
  milvus-password: MILVUS_PASSWORD_PLACEHOLDER
